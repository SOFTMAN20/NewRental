<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clear Cache - Wanachuo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #ea6d32;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }
    button {
      background: linear-gradient(135deg, #ea6d32 0%, #f97316 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
      font-weight: 600;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.05);
    }
    button:active {
      transform: scale(0.95);
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      display: none;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .instructions {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
      border-left: 4px solid #ea6d32;
    }
    .instructions h3 {
      margin-top: 0;
      color: #ea6d32;
    }
    .instructions ol {
      margin: 10px 0;
      padding-left: 20px;
    }
    .instructions li {
      margin: 8px 0;
    }
    .icon {
      font-size: 48px;
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔄</div>
    <h1>Clear Cache & Reload Icons</h1>
    <p class="subtitle">Wanachuo.com - Refresh App Data</p>
    
    <div class="instructions">
      <h3>📱 Kwa nini Clear Cache?</h3>
      <p>Kufuta cache inasaidia:</p>
      <ol>
        <li>Kuona logo mpya/icons</li>
        <li>Kupata updates za app</li>
        <li>Kuondoa bugs za zamani</li>
        <li>Kuona features mpya</li>
      </ol>
    </div>

    <button onclick="clearAllCaches()">🗑️ Clear All Caches</button>
    <button onclick="unregisterServiceWorker()">🔧 Unregister Service Worker</button>
    <button onclick="clearAndReload()">🔄 Clear Everything & Reload</button>
    <button onclick="goHome()">🏠 Back to Home</button>

    <div id="status" class="status"></div>
  </div>

  <script>
    function showStatus(message, type = 'success') {
      const statusDiv = document.getElementById('status');
      statusDiv.textContent = message;
      statusDiv.className = `status ${type}`;
      statusDiv.style.display = 'block';
      
      setTimeout(() => {
        statusDiv.style.display = 'none';
      }, 5000);
    }

    async function clearAllCaches() {
      try {
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames.map(name => caches.delete(name)));
        showStatus(`✅ Cleared ${cacheNames.length} caches successfully!`, 'success');
        console.log('All caches cleared:', cacheNames);
      } catch (error) {
        showStatus('❌ Error clearing caches: ' + error.message, 'error');
        console.error('Cache clear error:', error);
      }
    }

    async function unregisterServiceWorker() {
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(reg => reg.unregister()));
        showStatus(`✅ Unregistered ${registrations.length} service workers!`, 'success');
        console.log('Service workers unregistered:', registrations);
      } catch (error) {
        showStatus('❌ Error unregistering service workers: ' + error.message, 'error');
        console.error('Service worker unregister error:', error);
      }
    }

    async function clearAndReload() {
      try {
        // Clear all caches
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames.map(name => caches.delete(name)));
        
        // Unregister service workers
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(reg => reg.unregister()));
        
        // Clear localStorage
        localStorage.clear();
        
        // Clear sessionStorage
        sessionStorage.clear();
        
        showStatus('✅ Everything cleared! Reloading in 2 seconds...', 'success');
        
        // Reload page after 2 seconds
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      } catch (error) {
        showStatus('❌ Error: ' + error.message, 'error');
        console.error('Clear and reload error:', error);
      }
    }

    function goHome() {
      window.location.href = '/';
    }

    // Show current cache info on load
    window.addEventListener('load', async () => {
      try {
        const cacheNames = await caches.keys();
        const registrations = await navigator.serviceWorker.getRegistrations();
        console.log('Current caches:', cacheNames);
        console.log('Active service workers:', registrations);
      } catch (error) {
        console.error('Error checking caches:', error);
      }
    });
  </script>
</body>
</html>
